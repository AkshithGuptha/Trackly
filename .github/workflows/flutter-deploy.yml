name: Trackly Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --org=com.akshithguptha --project-name=trackly .

      - name: Install Android API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Android API level
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Remove generated placeholder tests
        run: rm -rf test

      - name: Analyze Flutter client
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Validate Supabase release configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::SUPABASE_URL GitHub Actions secret is missing."; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo "::error::SUPABASE_ANON_KEY GitHub Actions secret is missing."; exit 1; }

      - name: Prepare Supabase release defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          CLEAN_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '\r\n')"
          {
            printf 'SUPABASE_URL=%s\n' "$CLEAN_URL"
            printf 'SUPABASE_ANON_KEY=%s\n' "$CLEAN_KEY"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Build Play Store AAB
        run: flutter build appbundle --release --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trackly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: trackly-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
